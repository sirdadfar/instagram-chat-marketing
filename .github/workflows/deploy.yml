name: Deploy to production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, bcmath, intl, pdo_mysql
          coverage: none

      - name: Validate Composer
        run: composer validate --no-check-publish

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: PHP syntax check
        run: |
          find app config routes database bootstrap -type f -name '*.php' -print0 | xargs -0 -n1 php -l

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install sshpass
        run: |
          sudo apt-get update
          sudo apt-get install -y sshpass

      - name: Create release archive
        run: |
          tar --exclude='./.git' --exclude='./.env' --exclude='./vendor' --exclude='./node_modules' --exclude='./release.tar.gz' -czf /tmp/ig-automate-release.tar.gz .

      - name: Upload release
        env:
          SSHPASS: ${{ secrets.SERVER_PASSWORD }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT || 22 }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          set -Eeuo pipefail
          sshpass -e ssh \
            -p "$SERVER_PORT" \
            -o StrictHostKeyChecking=no \
            "$SERVER_USER@$SERVER_HOST" \
            'cat > /tmp/ig-automate-release.tar.gz' < /tmp/ig-automate-release.tar.gz

      - name: Deploy release
        env:
          SSHPASS: ${{ secrets.SERVER_PASSWORD }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT || 22 }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PATH: ${{ secrets.SERVER_PATH }}
        run: |
          set -Eeuo pipefail

          REMOTE_CMD="bash -s -- $(printf '%q' "$SERVER_PATH")"
          sshpass -e ssh \
            -p "$SERVER_PORT" \
            -o StrictHostKeyChecking=no \
            "$SERVER_USER@$SERVER_HOST" \
            "$REMOTE_CMD" <<'REMOTE'
          set -Eeuo pipefail
          APP_PATH="$1"
          RELEASE="/tmp/ig-automate-release.tar.gz"
          TIMESTAMP="$(date +%Y%m%d%H%M%S)"
          BACKUP="/tmp/ig-automate-backup-$TIMESTAMP.tar.gz"

          APP_PATH="${SERVER_PATH:?SERVER_PATH secret is required}"

          if [ -f "$APP_PATH/.env" ]; then
            cp "$APP_PATH/.env" "/tmp/ig-automate-env-$TIMESTAMP"
          fi

          tar --exclude='./vendor' -czf "$BACKUP" -C "$APP_PATH" .
          tar -xzf "$RELEASE" -C "$APP_PATH"

          if [ -f "/tmp/ig-automate-env-$TIMESTAMP" ]; then
            cp "/tmp/ig-automate-env-$TIMESTAMP" "$APP_PATH/.env"
            rm -f "/tmp/ig-automate-env-$TIMESTAMP"
          fi

          cd "$APP_PATH"
          composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader
          php artisan migrate --force
          php artisan optimize:clear
          php artisan config:cache
          php artisan route:cache
          php artisan view:cache

          if command -v supervisorctl >/dev/null 2>&1; then
            supervisorctl reread || true
            supervisorctl update || true
            supervisorctl restart 'ig-automate-worker:*' || true
          fi

          if command -v systemctl >/dev/null 2>&1; then
            systemctl reload apache2 2>/dev/null || systemctl reload httpd 2>/dev/null || true
          fi

          rm -f "$RELEASE"
          echo "Deployment completed successfully: $TIMESTAMP"
          REMOTE
